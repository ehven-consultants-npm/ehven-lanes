name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish package and release assets
    runs-on: ubuntu-latest
    environment: npm-production

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify tag commit belongs to main
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor \
            "${GITHUB_SHA}" \
            "origin/main"

      - name: Verify release version
        run: |
          set -euo pipefail
          node scripts/verify-version.mjs \
            "${GITHUB_REF_NAME}"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package
        run: pnpm run check

      - name: Prepare release artifacts
        id: artifacts
        run: |
          set -euo pipefail

          ARTIFACT_DIRECTORY="release"
          TEMP_DIRECTORY="$(mktemp -d)"

          PACKAGE_NAME="$(
            node --input-type=module \
              --eval="import packageMetadata from './package.json' with { type: 'json' }; console.log(packageMetadata.name);"
          )"

          PACKAGE_VERSION="$(
            node --input-type=module \
              --eval="import packageMetadata from './package.json' with { type: 'json' }; console.log(packageMetadata.version);"
          )"

          mkdir -p "${ARTIFACT_DIRECTORY}"

          PACKAGE_TARBALL="$(
            npm pack \
              --pack-destination "${ARTIFACT_DIRECTORY}" \
              --silent
          )"

          cp dist/lanes.css \
            "${ARTIFACT_DIRECTORY}/lanes.css"

          cp dist/lanes.min.css \
            "${ARTIFACT_DIRECTORY}/lanes.min.css"

          tar -xzf \
            "${ARTIFACT_DIRECTORY}/${PACKAGE_TARBALL}" \
            -C "${TEMP_DIRECTORY}"

          cmp \
            dist/lanes.css \
            "${TEMP_DIRECTORY}/package/dist/lanes.css"

          cmp \
            dist/lanes.min.css \
            "${TEMP_DIRECTORY}/package/dist/lanes.min.css"

          (
            cd "${ARTIFACT_DIRECTORY}"

            sha256sum \
              lanes.css \
              lanes.min.css \
              "${PACKAGE_TARBALL}" \
              > SHA256SUMS
          )

          echo "package_name=${PACKAGE_NAME}" \
            >> "${GITHUB_OUTPUT}"

          echo "package_version=${PACKAGE_VERSION}" \
            >> "${GITHUB_OUTPUT}"

          echo "package_tarball=${PACKAGE_TARBALL}" \
            >> "${GITHUB_OUTPUT}"

      - name: Publish package through npm OIDC
        run: |
          set -euo pipefail

          PACKAGE_NAME="${{ steps.artifacts.outputs.package_name }}"
          PACKAGE_VERSION="${{ steps.artifacts.outputs.package_version }}"

          if npm view \
            "${PACKAGE_NAME}@${PACKAGE_VERSION}" \
            version \
            > /dev/null 2>&1
          then
            echo \
              "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published; skipping npm publish."
          else
            npm publish --access public
          fi

      - name: Create or repair GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          ARTIFACT_DIRECTORY="release"

          if gh release view "${TAG}" > /dev/null 2>&1
          then
            gh release upload \
              "${TAG}" \
              "${ARTIFACT_DIRECTORY}"/* \
              --clobber
          else
            gh release create \
              "${TAG}" \
              "${ARTIFACT_DIRECTORY}"/* \
              --title "${TAG}" \
              --generate-notes \
              --verify-tag
          fi
