name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish package and release assets
    runs-on: ubuntu-latest
    environment: npm-production

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify tag commit belongs to main
        run: |
          set -euo pipefail

          git fetch origin main

          git merge-base --is-ancestor \
            "${GITHUB_SHA}" \
            "origin/main"

      - name: Verify release version
        run: |
          set -euo pipefail

          node scripts/verify-version.mjs \
            "${GITHUB_REF_NAME}"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package
        run: pnpm run check

      - name: Prepare release artifacts
        id: artifacts
        run: |
          set -euo pipefail

          ARTIFACT_DIRECTORY="release"
          TEMP_DIRECTORY="$(mktemp -d)"

          trap 'rm -rf "${TEMP_DIRECTORY}"' EXIT

          PACKAGE_NAME="$(
            node --input-type=module \
              --eval="import packageMetadata from './package.json' with { type: 'json' }; console.log(packageMetadata.name);"
          )"

          PACKAGE_VERSION="$(
            node --input-type=module \
              --eval="import packageMetadata from './package.json' with { type: 'json' }; console.log(packageMetadata.version);"
          )"

          mkdir -p "${ARTIFACT_DIRECTORY}"

          npm pack \
            --pack-destination "${ARTIFACT_DIRECTORY}" \
            --silent \
            > /dev/null

          shopt -s nullglob

          PACKAGE_TARBALLS=(
            "${ARTIFACT_DIRECTORY}"/*.tgz
          )

          shopt -u nullglob

          if (( ${#PACKAGE_TARBALLS[@]} != 1 ))
          then
            echo \
              "::error::Expected exactly one npm tarball, found ${#PACKAGE_TARBALLS[@]}."

            exit 1
          fi

          PACKAGE_TARBALL="${PACKAGE_TARBALLS[0]##*/}"

          cp \
            dist/lanes.css \
            "${ARTIFACT_DIRECTORY}/lanes.css"

          cp \
            dist/lanes.min.css \
            "${ARTIFACT_DIRECTORY}/lanes.min.css"

          tar -xzf \
            "${ARTIFACT_DIRECTORY}/${PACKAGE_TARBALL}" \
            -C "${TEMP_DIRECTORY}"

          cmp \
            dist/lanes.css \
            "${TEMP_DIRECTORY}/package/dist/lanes.css"

          cmp \
            dist/lanes.min.css \
            "${TEMP_DIRECTORY}/package/dist/lanes.min.css"

          (
            cd "${ARTIFACT_DIRECTORY}"

            sha256sum \
              lanes.css \
              lanes.min.css \
              "${PACKAGE_TARBALL}" \
              > SHA256SUMS
          )

          echo "package_name=${PACKAGE_NAME}" \
            >> "${GITHUB_OUTPUT}"

          echo "package_version=${PACKAGE_VERSION}" \
            >> "${GITHUB_OUTPUT}"

          echo "package_tarball=${PACKAGE_TARBALL}" \
            >> "${GITHUB_OUTPUT}"

      - name: Publish verified tarball through npm OIDC
        run: |
          set -euo pipefail

          ARTIFACT_DIRECTORY="release"
          PACKAGE_NAME="${{ steps.artifacts.outputs.package_name }}"
          PACKAGE_VERSION="${{ steps.artifacts.outputs.package_version }}"
          PACKAGE_TARBALL="${{ steps.artifacts.outputs.package_tarball }}"
          PACKAGE_PATH="${ARTIFACT_DIRECTORY}/${PACKAGE_TARBALL}"
          REGISTRY_ERROR_FILE="$(mktemp)"

          trap 'rm -f "${REGISTRY_ERROR_FILE}"' EXIT

          LOCAL_SHASUM="$(
            sha1sum "${PACKAGE_PATH}" \
              | awk '{ print $1 }'
          )"

          if PUBLISHED_SHASUM="$(
            npm view \
              "${PACKAGE_NAME}@${PACKAGE_VERSION}" \
              dist.shasum \
              2> "${REGISTRY_ERROR_FILE}"
          )"
          then
            if [[ "${PUBLISHED_SHASUM}" != "${LOCAL_SHASUM}" ]]
            then
              echo \
                "::error::The npm registry tarball does not match the verified release tarball."

              echo \
                "Local SHA-1: ${LOCAL_SHASUM}"

              echo \
                "npm SHA-1: ${PUBLISHED_SHASUM}"

              exit 1
            fi

            echo \
              "${PACKAGE_NAME}@${PACKAGE_VERSION} already exists and matches the verified tarball; skipping npm publish."
          elif grep -Eq \
            'E404|404 Not Found' \
            "${REGISTRY_ERROR_FILE}"
          then
            npm publish \
              "./${PACKAGE_PATH}" \
              --access public
          else
            cat "${REGISTRY_ERROR_FILE}" >&2

            echo \
              "::error::Unable to determine whether ${PACKAGE_NAME}@${PACKAGE_VERSION} already exists."

            exit 1
          fi

      - name: Create or repair GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          ARTIFACT_DIRECTORY="release"

          if gh release view "${TAG}" > /dev/null 2>&1
          then
            gh release upload \
              "${TAG}" \
              "${ARTIFACT_DIRECTORY}"/* \
              --clobber
          else
            gh release create \
              "${TAG}" \
              "${ARTIFACT_DIRECTORY}"/* \
              --title "${TAG}" \
              --generate-notes \
              --verify-tag
          fi
